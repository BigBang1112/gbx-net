name: CI

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/ci.yml
      - Src/**
      - Benchmarks/**
      - Generators/**
      - Resources/**
      - Samples/**
      - Templates/**
      - Tests/**
      - Tools/**
      - Directory.Build.props
      - Build/**
      - global.json
      - GBX.NET.slnx
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - Src/**
      - Benchmarks/**
      - Generators/**
      - Resources/**
      - Samples/**
      - Templates/**
      - Tests/**
      - Tools/**
      - Directory.Build.props
      - Build/**
      - global.json
      - GBX.NET.slnx
  workflow_dispatch:

jobs:
  ci:
    name: Continuous Integration
    uses: bigbang1112/workflows/.github/workflows/dotnet-ci.yml@main
    with:
      dotnet-version: |
        10.0.x
        9.0.x
        8.0.x
      restore-args: -p:SkipWasmNative=true
      build-args: -p:SkipWasmNative=true

name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      filter:
        description: BenchmarkDotNet filter (for example, *GeneratorBenchmarks*)
        type: string
        default: '*'
      job:
        description: BenchmarkDotNet job (Dry validates execution only)
        type: choice
        default: Short
        options: [Dry, Short, Default]

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Run benchmarks
        env:
          BENCHMARK_FILTER: ${{ inputs.filter }}
          BENCHMARK_JOB: ${{ inputs.job }}
        run: |
          dotnet run --project Benchmarks/GBX.NET.Benchmarks -c Release -- \
            --filter "$BENCHMARK_FILTER" --job "$BENCHMARK_JOB"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-${{ github.sha }}-${{ inputs.job }}
          path: BenchmarkDotNet.Artifacts/
          if-no-files-found: warn
          retention-days: 14
